; ESP8266 화면 펌웨어
;   pio run -e smalltv     GeekMagic SmallTV(ESP-12F + 1.54" 240x240). 처음에는 원래 펌웨어의 웹 업데이트로 올린다
;   pio run -e nodemcuv2   NodeMCU + ST7789 SPI 화면 모듈(점퍼선 배선, src/main.cpp 머리말)
; 그 뒤 업데이트는 OTA(espota, 포트 8266).

[env]
platform = espressif8266@4.2.1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps =
  adafruit/Adafruit GFX Library@1.11.11
  adafruit/Adafruit ST7735 and ST7789 Library@1.11.0

[env:smalltv]
board = esp12e
build_flags = -DBOARD_SMALLTV

[env:nodemcuv2]
board = nodemcuv2
